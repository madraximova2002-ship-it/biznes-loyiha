{% extends "base.html" %}

{% block content %}
<div class="card form-card animate-fadeInUp">
    <div class="card-header">
        <h3 class="card-title">🏷️ {{ page_title }}</h3>
    </div>
    <div class="card-body">
        <form method="post">
            {% csrf_token %}
            {% for field in form %}
            <div class="form-group">
                <label class="form-label" for="{{ field.id_for_label }}">{{ field.label }}</label>
                {{ field }}
                {% if field.errors %}
                <small style="color:var(--danger); font-size:12px;">{{ field.errors.0 }}</small>
                {% endif %}
            </div>
            {% endfor %}
            <div class="flex gap-12 mt-24">
                <button type="submit" class="btn btn-primary">💾 Saqlash</button>
                <a href="{% url 'category_list' %}" class="btn btn-outline">← Bekor qilish</a>
            </div>
        </form>
    </div>
</div>
{% endblock %}
